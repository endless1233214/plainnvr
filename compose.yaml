services:
  plainnvr:
    build: .
    container_name: plainnvr
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NVR_PORT: "8787"
      NVR_DATA_DIR: /data
      NVR_RECORDINGS_DIR: /recordings
      NVR_DEFAULT_SEGMENT_SECONDS: "60"
      # Optional sidecar app integration. Keep the token private.
      NVR_APP_TOKEN: ${NVR_APP_TOKEN:-}
      # Only set this when optional apps share a trusted Docker network.
      NVR_GO2RTC_RTSP_HOST: ${NVR_GO2RTC_RTSP_HOST:-127.0.0.1}
    volumes:
      - ./data:/data
      - ./recordings:/recordings
