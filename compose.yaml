services:
  plainnvr:
    build: .
    container_name: plainnvr
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NVR_PORT: "8787"
      NVR_DATA_DIR: /data
      NVR_RECORDINGS_DIR: /recordings
      NVR_DEFAULT_SEGMENT_SECONDS: "60"
    volumes:
      - ./data:/data
      - ./recordings:/recordings
