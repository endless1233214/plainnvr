<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlainNVR starting</title>
  <style>
    body { background: #10171c; color: #f4f7f8; font: 1.2rem system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    h1 { font-size: 2rem; }
    p { color: #b2c0c7; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>PlainNVR is starting</h1>
    <p>The server is not ready yet. This screen checks again automatically. Camera recording runs independently of this display.</p>
    <p>If this screen stays here, check the data disk and PlainNVR service from the maintenance console.</p>
  </main>
  <script>
    const appUrl = 'http://127.0.0.1:8787/';
    function probe() {
      const sheet = document.createElement('link');
      sheet.rel = 'stylesheet';
      sheet.href = `${appUrl}styles.css?ready=${Date.now()}`;
      sheet.onload = () => location.replace(appUrl);
      sheet.onerror = () => sheet.remove();
      document.head.appendChild(sheet);
      setTimeout(() => sheet.remove(), 4000);
    }
    probe();
    setInterval(probe, 5000);
  </script>
</body>
</html>
