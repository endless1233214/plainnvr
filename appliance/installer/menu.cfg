menu title PlainNVR OS Installer
include stdmenu.cfg
label plainnvr-install
    menu label ^Install PlainNVR OS
    menu default
    linux @PLAINNVR_KERNEL@
    initrd @PLAINNVR_INITRD@
    append boot=live components plainnvr.installer systemd.unit=multi-user.target systemd.wants=plainnvr-live-installer.service
label plainnvr-compatible
    menu label Install PlainNVR OS (^compatibility graphics)
    linux @PLAINNVR_KERNEL@
    initrd @PLAINNVR_INITRD@
    append boot=live components nomodeset plainnvr.installer systemd.unit=multi-user.target systemd.wants=plainnvr-live-installer.service
label plainnvr-install-text
    menu label Advanced: Debian ^text installer
    linux /install/vmlinuz
    initrd /install/initrd.gz
    append @APPEND_INSTALL@ --- quiet
label plainnvr-rescue
    menu label ^Rescue an installed system
    linux /install/vmlinuz
    initrd /install/initrd.gz
    append rescue/enable=true @APPEND_INSTALL@ --- quiet
