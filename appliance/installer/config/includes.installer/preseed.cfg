#_preseed_V1
# Human choices remain: language, keyboard, timezone, maintenance credentials,
# disk, partition method, partition review and confirmation of disk writes.
d-i netcfg/get_hostname string plainnvr
d-i netcfg/get_domain string local
d-i passwd/root-login boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true

# Adds a guided single-disk layout. Never supplies a disk or confirms erasure.
# GPT includes both BIOS GRUB and EFI boot partitions so either firmware works.
# OS: 24 GB; swap: 2 GB; recordings/database: remaining space (minimum 8 GB).
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string \
    plainnvr :: \
        1 1 1 free \
            $iflabel{ gpt } $reusemethod{ } method{ biosgrub } . \
        512 512 512 free \
            $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
        24000 24000 24000 ext4 \
            $primary{ } method{ format } format{ } use_filesystem{ } \
            filesystem{ ext4 } mountpoint{ / } . \
        2048 2048 2048 linux-swap \
            method{ swap } format{ } . \
        8000 10000 -1 ext4 \
            method{ format } format{ } use_filesystem{ } \
            filesystem{ ext4 } mountpoint{ /var/lib/plainnvr } .
d-i partman-auto/choose_recipe select plainnvr
d-i partman/early_command string /bin/sh /plainnvr-partman
d-i preseed/late_command string /bin/sh /plainnvr-late
