version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /build/go2rtc
    schedule:
      interval: weekly
    groups:
      go2rtc-dependencies:
        patterns:
          - "*"
