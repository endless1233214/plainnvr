name: Build PlainNVR image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plainnvr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shared-source links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          broken = [str(path) for path in Path("MacOS").rglob("*") if path.is_symlink() and not path.exists()]
          if broken:
              raise SystemExit(f"Broken macOS source links: {', '.join(broken)}")
          PY
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Build and test release runtime
        run: |
          docker build --pull -t plainnvr-ci .
          docker run --rm -v "$PWD/tests:/tests:ro" -e PYTHONPATH=/app plainnvr-ci python -m unittest discover -s /tests -v

          docker run -d --name plainnvr-startup-smoke -p 127.0.0.1::8787 plainnvr-ci
          trap 'docker logs plainnvr-startup-smoke || true; docker rm -f plainnvr-startup-smoke >/dev/null 2>&1 || true' EXIT

          port="$(docker port plainnvr-startup-smoke 8787/tcp | awk -F: 'NR == 1 { print $NF }')"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/api/health" > /tmp/plainnvr-health.json; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' plainnvr-startup-smoke)" != "true" ]; then
              echo "PlainNVR container exited before becoming ready."
              docker logs plainnvr-startup-smoke
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "PlainNVR did not become ready within 30 seconds."
            docker logs plainnvr-startup-smoke
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/plainnvr-health.json").read_text())
          if health.get("ok") is not True:
              raise SystemExit(f"Unexpected health response: {health!r}")
          print("release container startup smoke test OK")
          PY

          docker rm -f plainnvr-startup-smoke
          trap - EXIT
          docker save -o plainnvr-image.tar plainnvr-ci
      - name: Scan the image
        run: |
          docker run --rm -v "$PWD:/scan:ro" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/plainnvr-image.tar --scanners vuln --exit-code 1 \
            --vex /scan/build/security/go2rtc.openvex.json
      - name: Save verified image for publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-image
          path: plainnvr-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read app version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Download verified image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-image
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plainnvr
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker load -i plainnvr-image.tar
          docker tag plainnvr-ci "$IMAGE:$VERSION"
          docker tag plainnvr-ci "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
