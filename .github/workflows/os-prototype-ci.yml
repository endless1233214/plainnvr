name: PlainNVR OS prototype CI

on:
  push:
    branches:
      - feature/plainnvr-os-native-prototype
  pull_request:
    paths:
      - 'appliance/**'
      - 'app/**'
      - 'static/**'
      - 'build/**'
      - '.github/workflows/os-prototype-ci.yml'

permissions:
  contents: read

concurrency:
  group: plainnvr-os-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile Python
        run: python3 -m compileall -q app appliance

      - name: Run appliance tests
        run: python3 -m unittest discover -s appliance/tests -p 'test_*.py' -v

      - name: Run core Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run frontend tests
        run: node --test tests/*.test.cjs
